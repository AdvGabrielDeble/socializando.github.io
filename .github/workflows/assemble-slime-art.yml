name: Assemble Slime artwork

on:
  push:
    branches:
      - feature/archive-workshops-fix-slime-art-2026-10-19
    paths:
      - '.artifact-chunks/slime/**'
      - '.github/workflows/assemble-slime-art.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Assemble and verify artwork
        run: |
          if [ ! -f .artifact-chunks/slime/.complete ]; then
            echo "Chunks not complete yet."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          folder = Path(".artifact-chunks/slime")
          parts = sorted(folder.glob("*.part"))
          if not parts:
              raise SystemExit("No artwork chunks found")

          encoded = "".join(p.read_text().strip() for p in parts)
          raw = base64.b64decode(encoded, validate=True)

          expected_sha = "3d979595a1909cfd57dae9bef30756b449837f500faca26b5404c3c5ddbb12a1"
          expected_bytes = 49190
          actual_sha = hashlib.sha256(raw).hexdigest()

          if len(raw) != expected_bytes:
              raise SystemExit(f"Byte size mismatch: {len(raw)} != {expected_bytes}")
          if actual_sha != expected_sha:
              raise SystemExit(f"SHA-256 mismatch: {actual_sha}")

          target = Path("assets/oficinas/oficina-slime-2026-10-24.webp")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(raw)
          print(f"VERIFIED {target}: {len(raw)} bytes SHA-256={actual_sha}")
          PY

      - name: Commit verified artwork
        run: |
          if [ ! -f assets/oficinas/oficina-slime-2026-10-24.webp ]; then
            echo "Artwork not assembled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .artifact-chunks/slime
          git add assets/oficinas/oficina-slime-2026-10-24.webp
          git commit -m "Fix Slime artwork with verified binary" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
