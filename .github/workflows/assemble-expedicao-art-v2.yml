name: Assemble Expedition artwork v2

on:
  push:
    branches:
      - hotfix/expedicao-art-2026-10-03
    paths:
      - '.artifact-chunks/expedition-v2/**'
      - '.github/workflows/assemble-expedicao-art-v2.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Assemble verified web artwork
        run: |
          if [ ! -f .artifact-chunks/expedition-v2/.complete ]; then
            echo "Chunks not complete yet."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          folder = Path(".artifact-chunks/expedition-v2")
          parts = sorted(folder.glob("*.part"))
          if not parts:
              raise SystemExit("No artwork chunks found")

          encoded = "".join("".join(p.read_text().split()) for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          expected = "c0dacfae9358056a43bd2d3ee339c7734b8cafa755f3622c1edb9a418608bcf4"
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f"SHA-256 mismatch: {actual}")

          target = Path("assets/oficinas/expedicao-jurassica-2026-10-10-v2.webp")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(raw)
          print(f"{target}: {len(raw)} bytes, SHA-256 {actual}")
          PY

      - name: Commit artwork
        run: |
          if [ ! -f assets/oficinas/expedicao-jurassica-2026-10-10-v2.webp ]; then
            echo "Artwork not assembled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .artifact-chunks/expedition-v2
          git add assets/oficinas/expedicao-jurassica-2026-10-10-v2.webp
          git commit -m "LP: assemble new Expedition artwork" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
