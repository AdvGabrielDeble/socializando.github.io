name: Oficinas tests

on:
  push:
    branches:
      - main
      - 'hotfix/**'
      - feature/oficinas-v4.6.0
      - hotfix/v4.6.1-mobile-menu-whatsapp
      - hotfix/v4.6.2-pix-vaga-dialog
      - feature/v4.7.0-admin-oficinas
      - hotfix/v4.7.2-price-45
      - feature/v4.8.0-admin-auth
      - feature/v5-financial-foundation
      - fix/admin-manual-confirm-complete-registration-2026-10-06
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run workshop tests
        run: node --test oficinas/*.test.mjs
      - name: Syntax checks
        run: |
          node --check script.js
          node --check oficinas/core.js
          node --check oficinas/api.js
          node --check oficinas/public.js
          node --check oficinas/admin.js
